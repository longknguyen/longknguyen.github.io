plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.longnguyen.portfolio'
version = '1.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

springBoot {
    mainClass = 'com.longnguyen.portfolio.Main'
}

bootJar {
    archiveFileName = 'app.jar'
}

jar {
    enabled = false
}

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def npmCommand = isWindows
        ? 'npm.cmd'
        : (file('/opt/homebrew/bin/npm').exists() ? '/opt/homebrew/bin/npm' : 'npm')

tasks.register('buildFrontend', Exec) {
    workingDir file("$projectDir/frontend")
    commandLine npmCommand, 'run', 'build'
}

processResources.dependsOn tasks.named('buildFrontend')

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources']
    }
    test {
        java.srcDirs = ['src/test/java']
    }
}
