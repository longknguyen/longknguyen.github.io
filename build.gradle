import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.1.1'
    id 'io.spring.dependency-management' version '1.1.0'
}

group = 'com.longnguyen.portfolio'
version = '1.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

application {
    mainClass = 'com.longnguyen.portfolio.Main'
}

def npmCommand = OperatingSystem.current().isWindows()
        ? 'npm.cmd'
        : (file('/opt/homebrew/bin/npm').exists() ? '/opt/homebrew/bin/npm' : 'npm')

tasks.register('buildFrontend', Exec) {
    workingDir file("$projectDir/frontend")
    commandLine npmCommand, 'run', 'build'
}

processResources.dependsOn tasks.named('buildFrontend')

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        resources.srcDirs = ['src/main/resources']
    }
    test {
        java.srcDirs = ['src/test/java']
    }
}
