name: Auto Create PR to Main

on:
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Create or reuse pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'main';

            if (!context.ref.startsWith('refs/heads/')) {
              core.info(`Skipping non-branch ref: ${context.ref}`);
              return;
            }

            if (head === base || head === 'master') {
              core.info(`Skipping protected branch: ${head}`);
              return;
            }

            const existingPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base
            });

            if (existingPulls.length > 0) {
              core.info(`Open PR already exists: ${existingPulls[0].html_url}`);
              return;
            }

            const response = await github.rest.pulls.create({
              owner,
              repo,
              title: `Merge ${head} into ${base}`,
              head,
              base,
              body: [
                '## Summary',
                '',
                `Automated pull request created after pushing \`${head}\`.`,
                '',
                '## Notes',
                '',
                '- Review the branch changes before merging.',
                '- This PR was generated automatically by GitHub Actions.'
              ].join('\n')
            });

            core.info(`Created PR: ${response.data.html_url}`);
